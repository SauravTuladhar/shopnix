<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Shopnix</title>
<meta name="description" content="Track and review your past purchases on Shopnix.">
<link rel="canonical" href="https://sauravtuladhar.github.io/shopnix/orders.html">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="My Orders — Shopnix">
<meta property="og:description" content="Track and review your past purchases on Shopnix.">
<meta property="og:url" content="https://sauravtuladhar.github.io/shopnix/orders.html">
<meta name="twitter:card" content="summary">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://placehold.co data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-DiZtlK46rqTZC2CR33NJ+hRYF60pkxBQogyis7eu79E='; base-uri 'self'; form-action 'self'">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / <a href="account.html">My Account</a> / My Orders</div>
    <h1>My Orders</h1>
    <p>Track and review your past purchases</p>
  </div>
</section>

<main class="page-content">
  <div class="container">
    <div id="loggedOutView" class="form-card" style="display:none;">
      <h2>You're not logged in</h2>
      <p class="form-sub">Login to see your past orders.</p>
      <a href="login.html" class="btn btn-accent">Login</a>
      <p class="form-switch">New here? <a href="signup.html">Create an account</a></p>
    </div>
    <div id="ordersList"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/partials.js"></script>
<script src="js/products.js"></script>
<script src="js/common.js"></script>
<script>
const SAMPLE_ORDERS = [
  { id:'SPX-10234', date:'2026-10-01', items:'Wireless Earbuds Pro, Smart Fitness Watch', total:6398, status:'Delivered' },
  { id:'SPX-10198', date:'2026-09-22', items:'Memory Foam Pillow', total:999, status:'Delivered' },
  { id:'SPX-10165', date:'2026-10-08', items:'Running Shoes Air-X, Backpack Urban 20L', total:5498, status:'Shipped' },
  { id:'SPX-10151', date:'2026-10-11', items:'Vitamin C Serum', total:799, status:'Processing' },
  { id:'SPX-10090', date:'2026-08-30', items:'Yoga Mat 6mm', total:1199, status:'Cancelled' },
];

const STATUS_CLASS = {
  Delivered:'status-delivered',
  Shipped:'status-shipped',
  Processing:'status-processing',
  Cancelled:'status-cancelled',
};

function renderOrders(){
  const wrap = document.getElementById('ordersList');
  const loggedOutView = document.getElementById('loggedOutView');
  const user = getUser();

  loggedOutView.style.display = user ? 'none' : 'block';
  wrap.style.display = user ? 'block' : 'none';
  if (!user) return;

  wrap.innerHTML = SAMPLE_ORDERS.map(o => `
    <div class="order-card">
      <div class="order-info">
        <h4>Order #${o.id}</h4>
        <span>${o.date} &middot; ${o.items}</span>
        <span>Total: ${money(o.total)}</span>
      </div>
      <div>
        <span class="status-badge ${STATUS_CLASS[o.status]}">${o.status}</span>
        <a href="track-order.html?order=${o.id}" class="see-all" style="margin-left:12px;">Track &rsaquo;</a>
      </div>
    </div>
  `).join('');
}
renderOrders();
</script>
</body>
</html>
