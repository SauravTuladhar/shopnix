<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Shopnix</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://placehold.co data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://rymkwiaaeopzerviomnu.supabase.co; base-uri 'self'; form-action 'self'">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<header class="admin-topbar">
  <div class="container">
    <span class="logo">Shop<span>nix</span> Admin</span>
    <div class="admin-topbar-right">
      <span id="adminGreeting">Hi there</span>
      <button type="button" class="btn btn-outline" id="adminLogoutBtn" style="background:#fff;">Logout</button>
    </div>
  </div>
</header>

<main class="page-content">
  <div class="container">

    <div class="admin-tabs">
      <button type="button" class="admin-tab active" data-panel="productsPanel">Products</button>
      <button type="button" class="admin-tab" data-panel="ordersPanel">Orders</button>
    </div>

    <section id="productsPanel" class="admin-panel active">
      <div class="form-card" style="max-width:none;">
        <h2 id="productFormTitle">Add Product</h2>
        <form id="productForm" novalidate>
          <div class="admin-form-grid">
            <div class="field">
              <label for="productIdInput">Product ID (auto from name)</label>
              <input type="text" id="productIdInput" placeholder="generated-from-name" disabled>
            </div>
            <div class="field">
              <label for="productNameInput">Name</label>
              <input type="text" id="productNameInput" required>
            </div>
            <div class="field">
              <label for="productCategoryInput">Category</label>
              <select id="productCategoryInput" required></select>
            </div>
            <div class="field">
              <label for="productPriceInput">Price (Rs.)</label>
              <input type="number" id="productPriceInput" min="0" step="0.01" required>
            </div>
            <div class="field">
              <label for="productOldPriceInput">Old Price (optional)</label>
              <input type="number" id="productOldPriceInput" min="0" step="0.01">
            </div>
            <div class="field">
              <label for="productStockInput">Stock Quantity</label>
              <input type="number" id="productStockInput" min="0" step="1" required>
            </div>
            <div class="field">
              <label for="productImgInput">Image URL</label>
              <input type="text" id="productImgInput" required>
            </div>
            <div class="field">
              <label for="productRatingInput">Rating (0-5)</label>
              <input type="number" id="productRatingInput" min="0" max="5" step="0.1" value="4" required>
            </div>
            <div class="field">
              <label for="productReviewsInput">Reviews Count</label>
              <input type="number" id="productReviewsInput" min="0" step="1" value="0" required>
            </div>
          </div>
          <div class="field-inline">
            <input type="checkbox" id="productFlashInput">
            <label for="productFlashInput">Flash sale item</label>
          </div>
          <button type="submit" class="btn btn-accent" style="width:auto;">Save Product</button>
          <button type="button" class="btn btn-outline" id="productCancelEdit" style="width:auto;display:none;">Cancel Edit</button>
          <div class="form-alert" id="productsAlert"></div>
        </form>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Flash</th><th>Actions</th></tr>
          </thead>
          <tbody id="productsTableBody"></tbody>
        </table>
      </div>
    </section>

    <section id="ordersPanel" class="admin-panel">
      <div class="form-alert" id="ordersAlert" style="margin-bottom:12px;"></div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Order #</th><th>Placed</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>
          </thead>
          <tbody id="ordersTableBody"></tbody>
        </table>
      </div>
    </section>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/admin-dashboard.js"></script>
</body>
</html>
