<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Order — Shopnix</title>
<meta name="description" content="Enter your order ID to track the latest status of your Shopnix order.">
<link rel="canonical" href="https://sauravtuladhar.github.io/shopnix/account/track-order.html">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Track Order — Shopnix">
<meta property="og:description" content="Enter your order ID to track the latest status of your Shopnix order.">
<meta property="og:url" content="https://sauravtuladhar.github.io/shopnix/account/track-order.html">
<meta name="twitter:card" content="summary">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://placehold.co https://rymkwiaaeopzerviomnu.supabase.co data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net 'sha256-R234WnjFiduGOgTVR5qvHmZ4hP+D31GUEFP0KI9pVoM='; connect-src 'self' https://rymkwiaaeopzerviomnu.supabase.co; base-uri 'self'; form-action 'self'">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="../index.html">Home</a> / Track Order</div>
    <h1>Track Your Order</h1>
    <p>Enter your order ID to see its latest status</p>
  </div>
</section>

<main class="page-content">
  <div class="container">
    <div class="form-card account-form-card">
      <h2>Order Tracking</h2>
      <form id="trackForm" novalidate>
        <div class="field" id="orderIdField">
          <label for="orderIdInput">Order ID</label>
          <input type="text" id="orderIdInput" placeholder="e.g. SPX-10234">
          <div class="field-error">Please enter your order ID.</div>
        </div>
        <button type="submit" class="btn btn-accent">Track Order</button>
      </form>

      <div id="trackResult" style="display:none; margin-top:24px;">
        <h2 id="trackOrderTitle" style="font-size:16px;"></h2>
        <ul class="timeline" id="trackTimeline"></ul>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="../js/partials.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/catalog.js"></script>
<script src="../js/common.js"></script>
<script>
const STAGES = ['Order Placed', 'Processing', 'Shipped', 'Out for Delivery', 'Delivered'];

function hashToStage(str){
  let sum = 0;
  for (let i = 0; i < str.length; i++) sum += str.charCodeAt(i);
  return (sum % STAGES.length) + 1; // at least 1 stage done
}

function renderTimeline(orderId){
  const doneCount = hashToStage(orderId.toUpperCase());
  document.getElementById('trackOrderTitle').textContent = `Order #${orderId.toUpperCase()}`;
  document.getElementById('trackTimeline').innerHTML = STAGES.map((stage, i) =>
    `<li class="${i < doneCount ? 'done' : ''}">${stage}</li>`
  ).join('');
  document.getElementById('trackResult').style.display = 'block';
}

document.getElementById('trackForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const field = document.getElementById('orderIdField');
  const input = document.getElementById('orderIdInput');
  const value = input.value.trim();
  field.classList.toggle('invalid', !value);
  if (!value) return;
  renderTimeline(value);
});

// Pre-fill from ?order= query param (e.g. linked from My Orders)
const prefill = new URLSearchParams(window.location.search).get('order');
if (prefill){
  document.getElementById('orderIdInput').value = prefill;
  renderTimeline(prefill);
}
</script>
</body>
</html>
