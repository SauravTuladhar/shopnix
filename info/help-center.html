<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help Center — Shopnix</title>
<meta name="description" content="Answers to the most common questions about shopping on Shopnix.">
<link rel="canonical" href="https://sauravtuladhar.github.io/shopnix/info/help-center.html">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Help Center — Shopnix">
<meta property="og:description" content="Answers to the most common questions about shopping on Shopnix.">
<meta property="og:url" content="https://sauravtuladhar.github.io/shopnix/info/help-center.html">
<meta name="twitter:card" content="summary">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://placehold.co data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net 'sha256-+w/4uFF99o7C6rKTKaReWjrr6pnsvVA9jCm5JF6jCmo='; connect-src 'self' https://rymkwiaaeopzerviomnu.supabase.co; base-uri 'self'; form-action 'self'">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="../index.html">Home</a> / Help Center</div>
    <h1>Help Center</h1>
    <p>Answers to the most common questions</p>
  </div>
</section>

<main class="page-content">
  <div class="container" style="max-width:720px;">
    <div id="faqList"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="../js/partials.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/catalog.js"></script>
<script src="../js/common.js"></script>
<script>
const FAQS = [
  { q:'How do I place an order?', a:'Browse or search for a product, click "Add to Cart", then go to your cart and proceed to checkout. Fill in your delivery details and choose a payment method to confirm your order.' },
  { q:'What payment methods are accepted?', a:'We accept Cash on Delivery, eSewa, and Khalti for all orders placed on Shopnix.' },
  { q:'How long does delivery take?', a:'Most orders within Kathmandu Valley are delivered within 2-3 business days. Orders to other districts may take 4-7 business days.' },
  { q:'Can I cancel my order?', a:'Yes, orders can be cancelled from the My Orders page as long as they have not yet shipped. Visit the Returns & Refund page for items that have already been delivered.' },
  { q:'How do I track my order?', a:'Go to Track Order from the footer or your account menu and enter your order ID to see its live status.' },
  { q:'How do I reset my password?', a:'This demo site does not send real emails — simply log in again with the same email to continue using your saved profile.' },
];

function renderFaq(){
  const wrap = document.getElementById('faqList');
  wrap.innerHTML = FAQS.map((f, i) => `
    <div class="accordion-item" data-idx="${i}">
      <button class="accordion-head" type="button">
        <span>${f.q}</span><span class="chev">&#9662;</span>
      </button>
      <div class="accordion-body"><p>${f.a}</p></div>
    </div>
  `).join('');

  wrap.querySelectorAll('.accordion-head').forEach(head => {
    head.addEventListener('click', () => {
      const item = head.closest('.accordion-item');
      const body = item.querySelector('.accordion-body');
      const isOpen = item.classList.contains('open');
      item.classList.toggle('open', !isOpen);
      body.style.maxHeight = isOpen ? '0' : body.scrollHeight + 'px';
    });
  });
}
renderFaq();
</script>
</body>
</html>
