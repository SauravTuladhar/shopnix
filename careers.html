<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Careers — Shopnix</title>
<meta name="description" content="Explore open roles and help build the future of online shopping in Nepal with Shopnix.">
<link rel="canonical" href="https://sauravtuladhar.github.io/shopnix/careers.html">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Careers — Shopnix">
<meta property="og:description" content="Explore open roles and help build the future of online shopping in Nepal with Shopnix.">
<meta property="og:url" content="https://sauravtuladhar.github.io/shopnix/careers.html">
<meta name="twitter:card" content="summary">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://placehold.co data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-aVIOB+K3ywY+uNBI6GDSjHrzFkDMMMy2XonXFUZ1XLo='; base-uri 'self'; form-action 'self'">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / Careers</div>
    <h1>Careers at Shopnix</h1>
    <p>Help us build the future of online shopping in Nepal</p>
  </div>
</section>

<main class="page-content">
  <div class="container" style="max-width:720px;">
    <div id="jobsList"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/partials.js"></script>
<script src="js/products.js"></script>
<script src="js/common.js"></script>
<script>
const JOBS = [
  { title:'Frontend Engineer', location:'Lalitpur (Hybrid)', type:'Full-time', desc:'Build and maintain the Shopnix storefront using modern web tooling. Work closely with design to ship pixel-perfect, accessible UI.' },
  { title:'Logistics Coordinator', location:'Kathmandu', type:'Full-time', desc:'Coordinate with delivery partners across the valley to ensure orders are dispatched and tracked accurately.' },
  { title:'Customer Support Associate', location:'Remote', type:'Part-time', desc:'Help customers with order issues, returns and general questions via chat and phone.' },
  { title:'Category Manager — Electronics', location:'Lalitpur', type:'Full-time', desc:'Own the electronics catalog: pricing, promotions, and seller relationships for the category.' },
];

function renderJobs(){
  const wrap = document.getElementById('jobsList');
  wrap.innerHTML = JOBS.map((job, i) => `
    <div class="accordion-item" data-idx="${i}">
      <button class="accordion-head" type="button">
        <span>${job.title}</span><span class="chev">&#9662;</span>
      </button>
      <div class="accordion-body">
        <div class="job-meta"><span>📍 ${job.location}</span><span>🕒 ${job.type}</span></div>
        <p>${job.desc}</p>
        <button class="btn btn-outline apply-btn" type="button" style="margin-top:10px;">Apply Now</button>
      </div>
    </div>
  `).join('');

  wrap.querySelectorAll('.accordion-head').forEach(head => {
    head.addEventListener('click', () => {
      const item = head.closest('.accordion-item');
      const body = item.querySelector('.accordion-body');
      const isOpen = item.classList.contains('open');
      item.classList.toggle('open', !isOpen);
      body.style.maxHeight = isOpen ? '0' : body.scrollHeight + 'px';
    });
  });

  wrap.querySelectorAll('.apply-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      showToast('Application submitted! (demo)');
    });
  });
}
renderJobs();
</script>
</body>
</html>
