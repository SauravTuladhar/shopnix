<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitleTag">Product Details — Shopnix</title>
<meta name="description" content="View full product details, pricing, and reviews, and shop related picks on Shopnix.">
<link rel="canonical" href="https://sauravtuladhar.github.io/shopnix/shop/product.html">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Product Details — Shopnix">
<meta property="og:description" content="View full product details, pricing, and reviews, and shop related picks on Shopnix.">
<meta property="og:url" content="https://sauravtuladhar.github.io/shopnix/shop/product.html">
<meta name="twitter:card" content="summary">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://placehold.co https://rymkwiaaeopzerviomnu.supabase.co data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdn.jsdelivr.net 'sha256-M3pqs4Uly7RibPtBBn233SbO3BwQl7CMYn+WvUHj7hQ='; connect-src 'self' https://rymkwiaaeopzerviomnu.supabase.co; base-uri 'self'; form-action 'self'">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb">
      <a href="../index.html">Home</a> / <a href="category.html" id="breadcrumbCategory">Category</a> / <span id="breadcrumbProduct">Product</span>
    </div>
    <h1 id="pageTitle">Product Details</h1>
    <p>Everything you need to know before you buy</p>
  </div>
</section>

<main class="page-content">
  <div class="container">
    <div id="productDetailRoot"></div>
    <section id="productDetailReviewsSection" class="product-detail-section" style="display:none;">
      <h2>Customer Reviews</h2>
      <div id="productReviewsSummary"></div>
      <div id="productReviewsList"></div>
      <div id="productReviewFormWrap"></div>
    </section>
    <section id="relatedProductsSection" class="product-detail-section" style="display:none;">
      <h2>Related Products</h2>
      <div class="product-grid" id="relatedProductsGrid"></div>
    </section>
  </div>
</main>

<div id="site-footer"></div>

<script src="../js/partials.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/catalog.js"></script>
<script src="../js/common.js"></script>
<script>
let currentQty = 1;

function getRequestedProductId(){
  return new URLSearchParams(window.location.search).get('id');
}

function renderNotFound(){
  document.title = 'Product Not Found — Shopnix';
  document.getElementById('pageTitle').textContent = 'Product Not Found';
  document.getElementById('breadcrumbCategory').style.display = 'none';
  document.getElementById('breadcrumbProduct').textContent = 'Not found';
  document.getElementById('productDetailRoot').innerHTML =
    '<p class="empty-state">Product not found. <a href="../index.html">Continue shopping &rsaquo;</a></p>';
  document.getElementById('relatedProductsSection').style.display = 'none';
  document.getElementById('productDetailReviewsSection').style.display = 'none';
}

function wireProductDetailActions(p, outOfStock){
  const qtyEl = document.getElementById('productDetailQty');
  const decBtn = document.getElementById('productDetailQtyDec');
  const incBtn = document.getElementById('productDetailQtyInc');
  const addBtn = document.getElementById('productDetailAddBtn');
  const wishBtn = document.getElementById('productDetailWishBtn');

  decBtn.addEventListener('click', () => {
    currentQty = Math.max(1, currentQty - 1);
    qtyEl.textContent = currentQty;
  });
  incBtn.addEventListener('click', () => {
    currentQty += 1;
    qtyEl.textContent = currentQty;
  });

  addBtn.addEventListener('click', () => {
    if (addBtn.disabled) return;
    addToCart(p.id, currentQty);
    showToast(`"${p.name}" added to cart`);
    currentQty = 1;
    qtyEl.textContent = currentQty;
  });

  wishBtn.addEventListener('click', () => {
    const added = toggleWishlist(p.id);
    wishBtn.classList.toggle('active', added);
    wishBtn.innerHTML = added ? '&#9829; Remove from Wishlist' : '&#9825; Add to Wishlist';
    showToast(added ? `Added "${p.name}" to wishlist` : `Removed "${p.name}" from wishlist`);
  });
}

function renderRelatedProducts(p){
  const related = PRODUCTS.filter(x => x.category === p.category && x.id !== p.id).slice(0, 4);
  const section = document.getElementById('relatedProductsSection');
  if (related.length === 0){
    section.style.display = 'none';
    return;
  }
  section.style.display = '';
  renderGrid(document.getElementById('relatedProductsGrid'), related);
}

function productDetailThumbHTML(url, idx, active){
  return `<img src="${url}" alt="Photo ${idx + 1}" class="product-detail-thumb${active ? ' active' : ''}" data-src="${url}">`;
}

function loadProductGallery(p){
  sb.from('product_images').select('url').eq('product_id', p.id).order('created_at')
    .then(({ data, error }) => {
      if (error || !data || data.length === 0) return;
      const media = document.querySelector('.product-detail-media');
      const mainImg = document.getElementById('productDetailMainImg');
      if (!media || !mainImg) return;
      const images = [p.img, ...data.map(r => r.url)];
      const thumbsHTML = images.map((url, i) => productDetailThumbHTML(url, i, i === 0)).join('');
      media.insertAdjacentHTML('beforeend', `<div class="product-detail-thumbs" id="productDetailThumbs">${thumbsHTML}</div>`);
      document.getElementById('productDetailThumbs').addEventListener('click', (e) => {
        const thumb = e.target.closest('.product-detail-thumb');
        if (!thumb) return;
        mainImg.src = thumb.dataset.src;
        document.querySelectorAll('.product-detail-thumb').forEach(t => t.classList.toggle('active', t === thumb));
      });
    })
    .catch(() => {});
}

function initLightbox(){
  const media = document.querySelector('.product-detail-media');
  if (!media) return;
  let overlay = document.getElementById('lightboxOverlay');
  if (!overlay){
    document.body.insertAdjacentHTML('beforeend', `
      <div class="lightbox-overlay" id="lightboxOverlay">
        <div class="lightbox-panel">
          <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
          <img id="lightboxImg" alt="">
        </div>
      </div>
    `);
    overlay = document.getElementById('lightboxOverlay');
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeLightbox(); });
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
  }
  media.addEventListener('click', (e) => {
    if (e.target.closest('.product-detail-thumb')) return;
    const mainImg = document.getElementById('productDetailMainImg');
    document.getElementById('lightboxImg').src = mainImg.src;
    overlay.classList.add('open');
  });
}
function closeLightbox(){ document.getElementById('lightboxOverlay').classList.remove('open'); }

function reviewRowHTML(r){
  const date = new Date(r.created_at).toLocaleDateString();
  return `
    <div class="review-row">
      <div class="review-row-head">
        <span class="review-stars">${renderStars(r.rating)}</span>
        <span class="review-author">${r.reviewer_name}</span>
        <span class="review-date text-light">${date}</span>
      </div>
      ${r.body ? `<p class="review-body">${r.body}</p>` : ''}
    </div>
  `;
}

async function loadProductReviews(p){
  const listEl = document.getElementById('productReviewsList');
  listEl.innerHTML = '<p class="empty-state">Loading reviews…</p>';
  const { data, error } = await sb.from('product_reviews').select('*').eq('product_id', p.id).order('created_at', { ascending: false });
  if (error){ listEl.innerHTML = ''; document.getElementById('productDetailReviewsSection').style.display = 'none'; return; }
  document.getElementById('productDetailReviewsSection').style.display = '';
  document.getElementById('productReviewsSummary').innerHTML =
    `<div class="rating">${renderStars(p.rating)} <span>${p.rating} out of 5 · ${p.reviews} review${p.reviews === 1 ? '' : 's'}</span></div>`;
  listEl.innerHTML = data.length
    ? data.map(reviewRowHTML).join('')
    : '<p class="empty-state">No reviews yet. Be the first to review this product!</p>';
}

async function hasQualifyingPurchase(productId, userId){
  const { data, error } = await sb
    .from('order_items')
    .select('id, orders!inner(status, user_id)')
    .eq('product_id', productId)
    .eq('orders.user_id', userId)
    .neq('orders.status', 'Cancelled')
    .limit(1);
  return !error && data && data.length > 0;
}

async function renderProductReviewForm(p){
  const wrap = document.getElementById('productReviewFormWrap');
  const user = getUser();
  if (!user){
    wrap.innerHTML = '<p class="form-sub">Please <a href="../account/login.html">log in</a> to leave a review.</p>';
    return;
  }
  const { data: existing } = await sb.from('product_reviews').select('id').eq('product_id', p.id).eq('user_id', user.id).maybeSingle();
  if (existing){
    wrap.innerHTML = "<p class=\"form-sub\">You've already reviewed this product. Thanks!</p>";
    return;
  }
  const qualifies = await hasQualifyingPurchase(p.id, user.id);
  if (!qualifies){
    wrap.innerHTML = '<p class="form-sub">Only customers who have purchased this product can leave a review.</p>';
    return;
  }
  wrap.innerHTML = `
    <form id="reviewForm" class="form-card" style="max-width:none;" novalidate>
      <h3>Write a Review</h3>
      <div class="field">
        <label for="reviewRatingInput">Rating</label>
        <select id="reviewRatingInput" required>
          <option value="5">5 — Excellent</option>
          <option value="4">4 — Good</option>
          <option value="3">3 — Average</option>
          <option value="2">2 — Poor</option>
          <option value="1">1 — Terrible</option>
        </select>
      </div>
      <div class="field">
        <label for="reviewBodyInput">Your Review (optional)</label>
        <textarea id="reviewBodyInput" rows="3"></textarea>
      </div>
      <button type="submit" class="btn btn-accent">Submit Review</button>
      <div class="form-alert" id="reviewAlert"></div>
    </form>
  `;
  document.getElementById('reviewForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const alertEl = document.getElementById('reviewAlert');
    const { error } = await sb.from('product_reviews').insert({
      product_id: p.id,
      user_id: user.id,
      reviewer_name: user.name,
      rating: Number(document.getElementById('reviewRatingInput').value),
      body: document.getElementById('reviewBodyInput').value.trim() || null,
    });
    if (error){
      alertEl.textContent = error.message || 'Could not submit review.';
      alertEl.className = 'form-alert show error';
      return;
    }
    alertEl.textContent = 'Thanks for your review!';
    alertEl.className = 'form-alert show success';
    wrap.innerHTML = "<p class=\"form-sub\">You've already reviewed this product. Thanks!</p>";
    const { data: fresh } = await sb.from('products').select('rating,reviews').eq('id', p.id).single();
    if (fresh){ p.rating = fresh.rating; p.reviews = fresh.reviews; }
    await loadProductReviews(p);
  });
}

function renderProductDetail(){
  const id = getRequestedProductId();
  const p = id ? getProductById(id) : null;
  if (!p){
    renderNotFound();
    return;
  }

  currentQty = 1;

  const discount = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : null;
  const outOfStock = p.stock !== undefined && p.stock !== null && p.stock <= 0;
  const wished = isWished(p.id);
  const description = (p.description && p.description.trim())
    ? p.description
    : 'No description available for this product yet.';
  let stockText;
  if (outOfStock) stockText = 'Out of stock';
  else if (p.stock !== undefined && p.stock !== null) stockText = `In stock (${p.stock} available)`;
  else stockText = 'In stock';

  document.title = p.name + ' — Shopnix';
  document.getElementById('pageTitle').textContent = p.name;
  const catLink = document.getElementById('breadcrumbCategory');
  catLink.textContent = categoryLabel(p.category);
  catLink.href = 'category.html?cat=' + encodeURIComponent(p.category);
  document.getElementById('breadcrumbProduct').textContent = p.name;

  document.getElementById('productDetailRoot').innerHTML = `
    <div class="product-detail split-layout">
      <div class="product-detail-media form-card" style="max-width:none;">
        ${discount ? `<div class="discount-tag">-${discount}%</div>` : ''}
        ${outOfStock ? `<div class="stock-tag">Out of stock</div>` : ''}
        <img src="${p.img}" alt="${p.name}" id="productDetailMainImg">
      </div>
      <div class="product-detail-info form-card" style="max-width:none;">
        <h1>${p.name}</h1>
        <div class="rating">${renderStars(p.rating)} <span>(${p.reviews} reviews)</span></div>
        <div class="price-row">
          <span class="price">${money(p.price)}</span>
          ${p.oldPrice ? `<span class="old-price">${money(p.oldPrice)}</span>` : ''}
        </div>
        <p class="product-detail-stock">${stockText}</p>
        <div class="product-detail-description">
          <h2>Description</h2>
          <p>${description}</p>
        </div>
        <div class="cart-item-qty product-detail-qty">
          <button class="qty-dec" id="productDetailQtyDec" type="button" aria-label="Decrease quantity">-</button>
          <span id="productDetailQty">1</span>
          <button class="qty-inc" id="productDetailQtyInc" type="button" aria-label="Increase quantity">+</button>
        </div>
        <div class="product-detail-actions">
          <button class="btn btn-accent" id="productDetailAddBtn"${outOfStock ? ' disabled' : ''}>${outOfStock ? 'Out of Stock' : 'Add to Cart'}</button>
          <button class="btn btn-outline${wished ? ' active' : ''}" id="productDetailWishBtn">${wished ? '&#9829; Remove from Wishlist' : '&#9825; Add to Wishlist'}</button>
        </div>
      </div>
    </div>
    <div class="mobile-sticky-cta">
      <button class="btn btn-accent" id="productDetailAddBtnMobile"${outOfStock ? ' disabled' : ''}>${outOfStock ? 'Out of Stock' : 'Add to Cart'}</button>
    </div>
  `;

  wireProductDetailActions(p, outOfStock);
  document.getElementById('productDetailAddBtnMobile').addEventListener('click', () => {
    document.getElementById('productDetailAddBtn').click();
  });
  initLightbox();
  renderRelatedProducts(p);
  loadProductGallery(p);
  loadProductReviews(p);
  onAuthChange(() => renderProductReviewForm(p));
}

renderSkeletonGrid(document.getElementById('productDetailRoot'), 1);
loadCatalog().then(renderProductDetail).catch(showCatalogError);
</script>
</body>
</html>
