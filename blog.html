<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopnix Blog</title>
<meta name="description" content="Shopping guides, deal roundups, and seller tips from the Shopnix blog.">
<link rel="canonical" href="https://sauravtuladhar.github.io/shopnix/blog.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Shopnix Blog">
<meta property="og:description" content="Shopping guides, deal roundups, and seller tips from the Shopnix blog.">
<meta property="og:url" content="https://sauravtuladhar.github.io/shopnix/blog.html">
<meta name="twitter:card" content="summary">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://placehold.co data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-g1Pw+21yBmFQ2xZbpy4QoSbAY+OGFxMGgA4sLFqAPf4='; base-uri 'self'; form-action 'self'">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">Home</a> / Shopnix Blog</div>
    <h1>Shopnix Blog</h1>
    <p>Shopping guides, deal roundups, and seller tips</p>
  </div>
</section>

<main class="page-content">
  <div class="container">
    <div class="blog-grid" id="blogGrid"></div>
  </div>
</main>

<div id="site-footer"></div>

<script src="partials.js"></script>
<script src="products.js"></script>
<script src="common.js"></script>
<script>
const POSTS = [
  { title:'5 Tips to Spot a Great Flash Sale Deal', date:'Oct 10, 2026', color:'0f6e5f', excerpt:'Learn how to tell a real discount from an inflated "before" price before you check out.' },
  { title:'A Beginner’s Guide to Shopping Online Safely', date:'Oct 2, 2026', color:'ff6b5b', excerpt:'Simple habits that protect your money and data when shopping on any marketplace.' },
  { title:'How Sellers Can Win the Festival Season', date:'Sep 25, 2026', color:'ffb400', excerpt:'Inventory, pricing and promotion tips for sellers gearing up for big sale events.' },
  { title:'Packing a Capsule Wardrobe on a Budget', date:'Sep 14, 2026', color:'374151', excerpt:'Mix and match pieces from our fashion catalog without breaking the bank.' },
  { title:'Smart Home Starter Kit Under Rs. 10,000', date:'Sep 5, 2026', color:'13997f', excerpt:'The essential gadgets to automate your home without overspending.' },
  { title:'Why Reviews Matter More Than Star Ratings', date:'Aug 29, 2026', color:'e14a39', excerpt:'How to read between the lines of product reviews before you buy.' },
];

function renderBlog(){
  document.getElementById('blogGrid').innerHTML = POSTS.map(p => `
    <article class="blog-card">
      <img src="https://placehold.co/400x225/${p.color}/ffffff?text=Shopnix+Blog" alt="${p.title}">
      <div class="blog-body">
        <span class="blog-date">${p.date}</span>
        <h4>${p.title}</h4>
        <p>${p.excerpt}</p>
      </div>
    </article>
  `).join('');
}
renderBlog();
</script>
</body>
</html>
